
<!DOCTYPE html>
<html>
<head>
    <title>Free AI Image Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; background: #667eea; min-height: 100vh; margin: 0; padding: 20px; }
        .box { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { color: #667eea; text-align: center; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #5568d3; }
        .img { text-align: center; margin-top: 20px; }
        .img img { max-width: 100%; border-radius: 5px; }
        .msg { padding: 10px; margin: 10px 0; border-radius: 5px; display: none; }
        .msg.show { display: block; }
        .error { background: #fee2e2; color: #dc2626; }
        .success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎨 Free AI Image Generator</h1>
        <form id="form">
            <textarea id="prompt" placeholder="Describe image: A cat wearing sunglasses..." required></textarea>
            <select id="style">
                <option>realistic</option>
                <option>cartoon</option>
                <option>anime</option>
                <option>oil painting</option>
                <option>digital art</option>
            </select>
            <button type="submit" id="btn">Generate ✨</button>
        </form>
        <div class="msg" id="msg"></div>
        <div class="img" id="img"></div>
    </div>

    <script>
        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const prompt = document.getElementById('prompt').value;
            const style = document.getElementById('style').value;
            const btn = document.getElementById('btn');
            
            btn.disabled = true;
            btn.textContent = 'Generating...';
            
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `${prompt}, style: ${style}` })
                });
                const data = await res.json();
                if (data.url) {
                    document.getElementById('img').innerHTML = `<img src="${data.url}" /><br><button onclick="location.reload()">Generate More</button>`;
                    document.getElementById('prompt').value = '';
                } else {
                    showMsg('Error: ' + data.error, 'error');
                }
            } catch (e) {
                showMsg('Error: ' + e.message, 'error');
            }
            btn.disabled = false;
            btn.textContent = 'Generate ✨';
        };
        
        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg show ' + type;
            setTimeout(() => msg.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
